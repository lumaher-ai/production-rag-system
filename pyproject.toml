[project]
name = "production-rag"
version = "0.1.0"
description = "A production-grade Retrieval-Augmented Generation system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "anthropic>=0.97.0",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.135.3",
    "google-auth>=2.38.0",
    "google-cloud-documentai>=3.0.0",
    "google-cloud-storage>=2.18.0",
    "greenlet>=3.4.0",
    "httpx>=0.28.1",
    "langchain>=1.2.17",
    "langchain-core>=1.3.2",
    "langchain-litellm>=0.6.4",
    "langchain-text-splitters>=1.1.2",
    "langdetect>=1.0.9",
    "langgraph>=1.1.10",
    "langgraph-checkpoint-postgres>=3.0.5",
    "litellm>=1.83.0",
    "markdownify>=1.2.2",
    "matplotlib>=3.11.0",
    "mypy>=2.1.0",
    "openai>=2.32.0",
    "passlib[argon2]>=1.7.4",
    "pgvector>=0.4.2",
    "playwright>=1.59.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.49",
    "structlog>=25.5.0",
    "tiktoken>=0.12.0",
    "uvicorn>=0.44.0",
]
[tool.ruff]
   line-length = 100
   target-version = "py312"
   
   [tool.ruff.lint]
   select = ["E", "F", "I", "N", "UP", "B", "SIM"]

   # B008 forbids function calls in argument defaults, which is exactly how FastAPI
   # declares dependencies and request params — `svc = Depends(get_svc)`. These
   # calls return sentinel objects that FastAPI resolves per request, so the
   # mutable-default hazard B008 exists to catch cannot occur. Without this, 54 of
   # the repo's routes are permanent false positives and the rule is worthless.
   [tool.ruff.lint.flake8-bugbear]
   extend-immutable-calls = [
       "fastapi.Depends",
       "fastapi.Query",
       "fastapi.Path",
       "fastapi.Body",
       "fastapi.Form",
       "fastapi.File",
       "fastapi.Header",
       "fastapi.Cookie",
       "fastapi.Security",
   ]
[tool.pytest.ini_options]
    asyncio_mode = "auto"
    testpaths = ["tests"]

# These two ship without type stubs or a py.typed marker. Silencing them here
# keeps a real type error visible instead of buried in import noise.
[[tool.mypy.overrides]]
    module = ["langdetect.*", "pgvector.*"]
    ignore_missing_imports = true
[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
    "testcontainers>=4.14.2",
    "types-passlib>=1.7.7.20260211",
    "types-python-jose>=3.5.0.20260408",
]
[build-system]
    requires = ["hatchling"]
    build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
    packages = ["src/production_rag"]
